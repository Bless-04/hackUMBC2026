name: GuideSense CI

on:
  push:
    branches: ["**"]          # every branch, every push
  pull_request:
    branches: ["**"]          # and every PR regardless of target

jobs:
  test:
    name: Run pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false         # run all matrix jobs even if one fails
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------------------------
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # -----------------------------------------------------------------------
      # 3. Install dependencies
      #    requirements.txt is optional — CI works even if the file doesn't exist.
      #    pytest is always installed explicitly.
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # -----------------------------------------------------------------------
      # 4. Run the full test suite with coverage
      # -----------------------------------------------------------------------
      - name: Run tests
        run: |
          pytest --tb=short -v \
            --cov=fusion \
            --cov=state_machine \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      # -----------------------------------------------------------------------
      # 5. Upload coverage report as an artifact (viewable in Actions UI)
      # -----------------------------------------------------------------------
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Lint job — catches syntax errors and obvious style issues fast
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check fusion.py state_machine.py main.py tests/
